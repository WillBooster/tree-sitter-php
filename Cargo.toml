[package]
authors = ["WillBooster Inc."]
autoexamples = false
categories = ["parser-implementations", "parsing", "text-editors"]
description = "PHP grammar for tree-sitter"
edition = "2024"
keywords = ["incremental", "parsing", "tree-sitter", "php"]
license = "MIT"
name = "willbooster-tree-sitter-php"
readme = "README.md"
repository = "https://github.com/WillBooster/tree-sitter-php"
version = "0.0.0"

build = "bindings/rust/build.rs"
include = [
  "bindings/rust/*",
  "common/*",
  "php/grammar.js",
  "php/src/*",
  "!php/src/.gitattributes",
  "php_only/grammar.js",
  "php_only/src/*",
  "!php_only/src/.gitattributes",
  "/queries/*.scm",
  "/tree-sitter.json",
  "/LICENSE",
]

[lib]
name = "tree_sitter_php"
path = "bindings/rust/lib.rs"

[dependencies]
tree-sitter-language = "0.1"

[build-dependencies]
cc = "1.2"

[dev-dependencies]
tree-sitter = { package = "willbooster-tree-sitter", version = "13.0.0" }
